<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>컷메이트 — 약관 및 정책</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #0D0D0D; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  .card { text-align: center; padding: 40px 24px; max-width: 420px; }
  .logo {
    width: 64px; height: 64px; border-radius: 14px; background: #fff; margin: 0 auto 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 14px;
  }
  .logo span { background: #0D0D0D; border-radius: 2px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  p.sub { color: #999; margin: 0 0 28px; font-size: 14px; line-height: 1.6; }
  a.btn {
    display: block; text-decoration: none; color: #0D0D0D; background: #fff;
    border-radius: 12px; padding: 15px; font-weight: 700; margin: 10px 0; font-size: 16px;
  }
  a.btn.alt { background: transparent; color: #fff; border: 1px solid #333; }
  .foot { color: #666; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span></span><span></span><span></span><span></span></div>
    <h1>컷메이트 (Cutmate)</h1>
    <p class="sub">함께 찍은 네컷을 나누는 우리만의 앨범</p>
    <a class="btn" href="./privacy.html">개인정보 처리방침</a>
    <a class="btn alt" href="./terms.html">이용약관</a>
    <p class="foot">운영자 황준하 · 문의 terry@vibebuild.ai.kr</p>
  </div>
</body>
</html>
